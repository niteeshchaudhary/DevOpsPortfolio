<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" stroke="#20242A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <linearGradient id="metalGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B6470"/>
      <stop offset="0.5" stop-color="#3C434D"/>
      <stop offset="1" stop-color="#262C34"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,0.30)"/>
      <stop offset="1" stop-color="rgba(0,180,255,0.20)"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="bolt">
      <circle r="4" fill="#596270"/>
      <circle r="2" fill="#252B33" stroke="none"/>
      <circle cx="-1.2" cy="-1.2" r="0.8" fill="rgba(255,255,255,0.30)" stroke="none"/>
    </g>
  </defs>

  <g id="shadow" stroke="none" fill="rgba(0,0,0,0.35)">
    <ellipse cx="170" cy="354" rx="78" ry="16"/>
    <ellipse cx="350" cy="358" rx="52" ry="12"/>
    <ellipse cx="452" cy="376" rx="44" ry="10"/>
    <ellipse cx="276" cy="368" rx="42" ry="9"/>
    <ellipse cx="94" cy="458" rx="60" ry="11"/>
  </g>

  <g id="metal">
    <!-- primary tank -->
    <path d="M96 132 L96 348 A64 28 0 0 0 224 348 L224 132 A64 28 0 0 0 96 132 Z" fill="url(#metalGrad)"/>
    <rect x="94" y="196" width="132" height="10" rx="5" fill="#252B33"/>
    <rect x="94" y="300" width="132" height="10" rx="5" fill="#252B33"/>
    <rect x="128" y="168" width="64" height="160" rx="10" fill="#0A0F14"/>
    <ellipse cx="160" cy="132" rx="64" ry="28" fill="#39414B"/>
    <ellipse cx="160" cy="130" rx="44" ry="18" fill="#252B33"/>
    <ellipse cx="160" cy="127" rx="18" ry="8" fill="#39414B"/>
    <rect x="86" y="188" width="12" height="10" rx="3" fill="#252B33"/>
    <rect x="86" y="312" width="12" height="10" rx="3" fill="#252B33"/>
    <!-- replica tank 1 -->
    <path d="M298 196 L298 352 A42 18 0 0 0 382 352 L382 196 A42 18 0 0 0 298 196 Z" fill="url(#metalGrad)"/>
    <rect x="296" y="246" width="88" height="8" rx="4" fill="#252B33"/>
    <rect x="320" y="222" width="40" height="112" rx="8" fill="#0A0F14"/>
    <ellipse cx="340" cy="196" rx="42" ry="18" fill="#39414B"/>
    <ellipse cx="340" cy="195" rx="28" ry="11" fill="#252B33"/>
    <!-- replica tank 2 -->
    <path d="M408 234 L408 372 A36 15 0 0 0 480 372 L480 234 A36 15 0 0 0 408 234 Z" fill="url(#metalGrad)"/>
    <rect x="406" y="272" width="76" height="8" rx="4" fill="#252B33"/>
    <rect x="427" y="256" width="34" height="96" rx="8" fill="#0A0F14"/>
    <ellipse cx="444" cy="234" rx="36" ry="15" fill="#39414B"/>
    <ellipse cx="444" cy="233" rx="24" ry="9" fill="#252B33"/>
    <!-- replication pipe network -->
    <rect x="148" y="84" width="24" height="44" rx="10" fill="url(#metalGrad)"/>
    <rect x="144" y="120" width="32" height="8" rx="4" fill="#252B33"/>
    <rect x="328" y="90" width="24" height="102" rx="10" fill="url(#metalGrad)"/>
    <rect x="324" y="184" width="32" height="8" rx="4" fill="#252B33"/>
    <rect x="432" y="90" width="24" height="140" rx="10" fill="url(#metalGrad)"/>
    <rect x="428" y="222" width="32" height="8" rx="4" fill="#252B33"/>
    <rect x="150" y="76" width="306" height="24" rx="10" fill="url(#metalGrad)"/>
    <rect x="138" y="64" width="44" height="44" rx="6" fill="#39414B"/>
    <!-- valve manifold 1 -->
    <rect x="292" y="52" width="8" height="20" rx="3" fill="#252B33"/>
    <rect x="284" y="70" width="24" height="36" rx="6" fill="#39414B"/>
    <g id="wheel">
      <animateTransform attributeName="transform" type="rotate" values="0 296 50;360 296 50" dur="6s" repeatCount="indefinite"/>
      <circle cx="296" cy="50" r="11" fill="#252B33"/>
      <line x1="288" y1="50" x2="304" y2="50" stroke="#596270"/>
      <line x1="296" y1="42" x2="296" y2="58" stroke="#596270"/>
      <circle cx="296" cy="50" r="3.5" fill="#596270"/>
    </g>
    <!-- valve manifold 2 -->
    <rect x="396" y="52" width="8" height="20" rx="3" fill="#252B33"/>
    <rect x="388" y="70" width="24" height="36" rx="6" fill="#39414B"/>
    <g id="wheel-2">
      <animateTransform attributeName="transform" type="rotate" values="0 400 50;-360 400 50" dur="6s" begin="-3s" repeatCount="indefinite"/>
      <circle cx="400" cy="50" r="11" fill="#252B33"/>
      <line x1="392" y1="50" x2="408" y2="50" stroke="#596270"/>
      <line x1="400" y1="42" x2="400" y2="58" stroke="#596270"/>
      <circle cx="400" cy="50" r="3.5" fill="#596270"/>
    </g>
    <!-- pressure gauge -->
    <rect x="216" y="56" width="8" height="22" rx="3" fill="#252B33"/>
    <circle cx="220" cy="42" r="16" fill="#171C24"/>
    <circle cx="220" cy="42" r="11.5" fill="#0A0F14"/>
    <line x1="214.3" y1="36.3" x2="211.9" y2="33.9" stroke="#596270"/>
    <line x1="220" y1="34" x2="220" y2="31" stroke="#596270"/>
    <line x1="225.7" y1="36.3" x2="228.1" y2="33.9" stroke="#596270"/>
    <!-- base couplers -->
    <rect x="214" y="330" width="26" height="18" rx="8" fill="url(#metalGrad)"/>
    <rect x="300" y="336" width="30" height="16" rx="8" fill="url(#metalGrad)"/>
    <!-- pumping station -->
    <rect x="240" y="294" width="56" height="14" rx="6" fill="#252B33"/>
    <rect x="232" y="304" width="72" height="60" rx="10" fill="url(#metalGrad)"/>
    <circle cx="268" cy="336" r="19" fill="#171C24"/>
    <g id="fan">
      <animateTransform attributeName="transform" type="rotate" values="0 268 336;360 268 336" dur="1.4s" repeatCount="indefinite"/>
      <rect x="265.5" y="320" width="5" height="13" rx="2.5" fill="#596270"/>
      <rect x="265.5" y="320" width="5" height="13" rx="2.5" fill="#596270" transform="rotate(90 268 336)"/>
      <rect x="265.5" y="320" width="5" height="13" rx="2.5" fill="#596270" transform="rotate(180 268 336)"/>
      <rect x="265.5" y="320" width="5" height="13" rx="2.5" fill="#596270" transform="rotate(270 268 336)"/>
      <circle cx="268" cy="336" r="4.5" fill="#39414B"/>
    </g>
    <line x1="288" y1="316" x2="296" y2="316" stroke="#596270"/>
    <line x1="288" y1="324" x2="296" y2="324" stroke="#596270"/>
    <!-- backup feed pipe -->
    <rect x="56" y="336" width="52" height="20" rx="8" fill="url(#metalGrad)"/>
    <rect x="56" y="336" width="20" height="42" rx="8" fill="url(#metalGrad)"/>
    <!-- backup vault -->
    <polygon points="36,372 58,352 154,352 132,372" fill="#39414B"/>
    <polygon points="132,372 154,352 154,432 132,452" fill="#171C24"/>
    <rect x="36" y="372" width="96" height="80" rx="10" fill="#252B33"/>
    <rect x="114" y="392" width="12" height="10" rx="3" fill="#39414B"/>
    <rect x="114" y="424" width="12" height="10" rx="3" fill="#39414B"/>
    <g id="door">
      <circle cx="84" cy="412" r="28" fill="url(#metalGrad)"/>
      <circle cx="84" cy="412" r="21" fill="#252B33"/>
      <circle cx="84" cy="412" r="11" stroke="#596270"/>
      <line x1="84" y1="401" x2="84" y2="423" stroke="#596270"/>
      <line x1="73" y1="412" x2="95" y2="412" stroke="#596270"/>
      <circle cx="84" cy="412" r="4" fill="#596270"/>
    </g>
    <!-- indicator housings -->
    <rect x="138" y="142" width="44" height="16" rx="6" fill="#171C24"/>
    <rect x="330" y="206" width="20" height="12" rx="6" fill="#171C24"/>
    <rect x="434" y="240" width="20" height="12" rx="6" fill="#171C24"/>
    <rect x="74" y="378" width="20" height="10" rx="4" fill="#252B33"/>
  </g>

  <g id="glass">
    <rect x="128" y="168" width="64" height="160" rx="10" fill="url(#glassGrad)"/>
    <rect x="320" y="222" width="40" height="112" rx="8" fill="url(#glassGrad)"/>
    <rect x="427" y="256" width="34" height="96" rx="8" fill="url(#glassGrad)"/>
    <rect x="76" y="180" width="14" height="152" rx="7" fill="url(#glassGrad)"/>
    <circle cx="220" cy="42" r="13" fill="url(#glassGrad)"/>
    <rect x="156" y="82" width="294" height="12" rx="6" fill="url(#glassGrad)"/>
    <rect x="154" y="98" width="12" height="26" rx="6" fill="url(#glassGrad)"/>
    <rect x="334" y="102" width="12" height="86" rx="6" fill="url(#glassGrad)"/>
    <rect x="438" y="102" width="12" height="124" rx="6" fill="url(#glassGrad)"/>
    <rect x="218" y="335" width="18" height="8" rx="4" fill="url(#glassGrad)"/>
    <rect x="306" y="340" width="18" height="8" rx="4" fill="url(#glassGrad)"/>
    <rect x="62" y="342" width="38" height="8" rx="4" fill="url(#glassGrad)"/>
    <rect x="62" y="342" width="8" height="30" rx="4" fill="url(#glassGrad)"/>
  </g>

  <g id="water" stroke="none">
    <g id="water-primary">
      <rect x="133" y="228" width="54" height="95" rx="8" fill="#4FC3F7" opacity="0.85"><animate attributeName="height" values="95;90;95" dur="6s" repeatCount="indefinite"/><animate attributeName="y" values="228;233;228" dur="6s" repeatCount="indefinite"/></rect>
      <ellipse cx="160" cy="229" rx="26" ry="5" fill="#6CD8FF" filter="url(#glow)"><animate attributeName="ry" values="5;6.5;5" dur="3.2s" repeatCount="indefinite"/></ellipse>
      <circle cx="148" cy="262" r="2.5" fill="#6CD8FF" opacity="0.6"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.4s" repeatCount="indefinite"/><animate attributeName="r" values="2.5;3.2;2.5" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="168" cy="288" r="2" fill="#6CD8FF" opacity="0.6"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.2s" begin="-0.7s" repeatCount="indefinite"/><animate attributeName="r" values="2;2.7;2" dur="2.2s" begin="-0.7s" repeatCount="indefinite"/></circle>
      <circle cx="156" cy="308" r="1.5" fill="#6CD8FF" opacity="0.6"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.6s" begin="-1.2s" repeatCount="indefinite"/><animate attributeName="r" values="1.5;2.2;1.5" dur="2.6s" begin="-1.2s" repeatCount="indefinite"/></circle>
    </g>
    <g id="water-replica-1">
      <rect x="325" y="264" width="30" height="65" rx="6" fill="#4FC3F7" opacity="0.85"/>
      <ellipse cx="340" cy="265" rx="14" ry="3.5" fill="#6CD8FF" filter="url(#glow)"/>
      <circle cx="336" cy="296" r="2" fill="#6CD8FF" opacity="0.6"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.5s" begin="-1s" repeatCount="indefinite"/><animate attributeName="r" values="2;2.7;2" dur="2.5s" begin="-1s" repeatCount="indefinite"/></circle>
    </g>
    <g id="water-replica-2">
      <rect x="432" y="302" width="24" height="45" rx="6" fill="#4FC3F7" opacity="0.85"/>
      <ellipse cx="444" cy="303" rx="11" ry="3" fill="#6CD8FF" filter="url(#glow)"/>
    </g>
    <g id="water-gauge">
      <rect x="79" y="244" width="8" height="84" rx="4" fill="#4FC3F7" opacity="0.85"/>
    </g>
    <g id="flow-replication" fill="none" stroke="#4FC3F7" stroke-width="6" stroke-dasharray="8 14" opacity="0.9" filter="url(#glow)">
      <animate attributeName="stroke-dashoffset" values="0;-22" dur="1.1s" repeatCount="indefinite"/>
      <line x1="160" y1="102" x2="160" y2="120"/>
      <line x1="164" y1="88" x2="442" y2="88"/>
      <line x1="340" y1="106" x2="340" y2="184"/>
      <line x1="444" y1="106" x2="444" y2="222"/>
    </g>
    <g id="flow-pump" fill="none" stroke="#4FC3F7" stroke-width="4" stroke-dasharray="4 8" opacity="0.9">
      <animate attributeName="stroke-dashoffset" values="0;-12" dur="0.9s" repeatCount="indefinite"/>
      <line x1="222" y1="339" x2="232" y2="339"/>
      <line x1="310" y1="344" x2="320" y2="344"/>
    </g>
    <g id="flow-backup" fill="none" stroke="#4FC3F7" stroke-width="4" stroke-dasharray="4 8" opacity="0.9">
      <animate attributeName="stroke-dashoffset" values="0;-12" dur="1.2s" begin="-0.4s" repeatCount="indefinite"/>
      <line x1="68" y1="346" x2="96" y2="346"/>
      <line x1="66" y1="350" x2="66" y2="368"/>
    </g>
  </g>

  <g id="lights" stroke="none">
    <circle cx="146" cy="150" r="3" fill="#2EE66B" filter="url(#glow)"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="158" cy="150" r="3" fill="#2EE66B" filter="url(#glow)"><animate attributeName="opacity" values="1;0.2;1" dur="1.8s" begin="-0.4s" repeatCount="indefinite"/></circle>
    <circle cx="170" cy="150" r="3" fill="#4FC3F7" filter="url(#glow)"><animate attributeName="opacity" values="1;0.25;1" dur="2s" begin="-0.8s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="212" r="3" fill="#2EE66B" filter="url(#glow)"><animate attributeName="opacity" values="1;0.2;1" dur="1.7s" begin="-0.3s" repeatCount="indefinite"/></circle>
    <circle cx="444" cy="246" r="3" fill="#F4B740" filter="url(#glow)"><animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="244" cy="314" r="2.5" fill="#2EE66B" filter="url(#glow)"><animate attributeName="opacity" values="1;0.2;1" dur="2.2s" begin="-1s" repeatCount="indefinite"/></circle>
    <circle cx="84" cy="383" r="3" fill="#2EE66B" filter="url(#glow)"><animate attributeName="opacity" values="1;0.2;1" dur="1.9s" begin="-0.6s" repeatCount="indefinite"/></circle>
    <g id="needle" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" values="-28 220 42; 28 220 42; -28 220 42" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" dur="5s" repeatCount="indefinite"/>
      <line x1="220" y1="42" x2="213" y2="35" stroke="#2EE66B" stroke-width="2" stroke-linecap="round"/>
      <circle cx="220" cy="42" r="2.5" fill="#2EE66B"/>
    </g>
  </g>

  <g id="bolts">
    <use href="#bolt" x="102" y="201"/>
    <use href="#bolt" x="218" y="201"/>
    <use href="#bolt" x="102" y="305"/>
    <use href="#bolt" x="218" y="305"/>
    <use href="#bolt" x="160" y="126"/>
    <use href="#bolt" x="302" y="250"/>
    <use href="#bolt" x="378" y="250"/>
    <use href="#bolt" x="412" y="276"/>
    <use href="#bolt" x="476" y="276"/>
    <use href="#bolt" x="146" y="72"/>
    <use href="#bolt" x="174" y="72"/>
    <use href="#bolt" x="146" y="100"/>
    <use href="#bolt" x="174" y="100"/>
    <use href="#bolt" x="238" y="356"/>
    <use href="#bolt" x="298" y="356"/>
    <use href="#bolt" x="44" y="380"/>
    <use href="#bolt" x="124" y="380"/>
    <use href="#bolt" x="44" y="444"/>
    <use href="#bolt" x="124" y="444"/>
  </g>

  <g id="overlay" fill="none">
    <path d="M96 132 A64 28 0 0 1 160 104" stroke="#596270" opacity="0.7"/>
    <path d="M298 196 A42 18 0 0 1 340 178" stroke="#596270" opacity="0.7"/>
    <path d="M408 234 A36 15 0 0 1 444 219" stroke="#596270" opacity="0.7"/>
    <rect x="136" y="176" width="7" height="140" rx="3.5" fill="rgba(255,255,255,0.30)" stroke="none" opacity="0.5"/>
    <rect x="326" y="228" width="5" height="98" rx="2.5" fill="rgba(255,255,255,0.30)" stroke="none" opacity="0.5"/>
    <rect x="432" y="262" width="5" height="82" rx="2.5" fill="rgba(255,255,255,0.30)" stroke="none" opacity="0.5"/>
    <rect x="79" y="186" width="3" height="138" rx="1.5" fill="rgba(255,255,255,0.30)" stroke="none" opacity="0.5"/>
    <line x1="158" y1="79" x2="448" y2="79" stroke="#596270" opacity="0.5"/>
    <path d="M64 392 A28 28 0 0 1 84 384" stroke="#596270" opacity="0.7"/>
    <line x1="68" y1="206" x2="74" y2="206" stroke="#596270"/>
    <line x1="68" y1="256" x2="74" y2="256" stroke="#596270"/>
    <line x1="68" y1="306" x2="74" y2="306" stroke="#596270"/>
  </g>
</svg>
