      <stop offset="1" stop-color="rgba(0,180,255,0.20)"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="bolt">
      <circle r="4" fill="#39414B"/>
      <circle r="1.8" fill="#252B33" stroke="none"/>
      <circle cx="-1.2" cy="-1.2" r="1" fill="#596270" stroke="none"/>
