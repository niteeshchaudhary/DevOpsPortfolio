<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="metalGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4D5664"/>
      <stop offset="50%" stop-color="#343B46"/>
      <stop offset="100%" stop-color="#1D232C"/>
    </linearGradient>
    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A2B3C"/>
      <stop offset="100%" stop-color="#0D151D"/>
    </linearGradient>
    <linearGradient id="highlightGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="greenGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="redGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Shadow -->
  <rect x="16" y="48" width="32" height="6" rx="3" fill="#000000" opacity="0.2" filter="url(#shadow)"/>
  
  <!-- Screen Bezel -->
  <g id="bezel">
    <rect x="16" y="16" width="32" height="28" rx="4" fill="#1A1F26" stroke="#2D3440" stroke-width="2"/>
  </g>
  
  <!-- Screen -->
  <g id="screen">
    <rect x="18" y="18" width="28" height="24" rx="2" fill="url(#screenGradient)"/>
  </g>
  
  <!-- Dashboard Grid -->
  <g id="dashboard">
    <rect x="20" y="20" width="12" height="10" rx="1" fill="#2D3440" stroke="#4D5664" stroke-width="0.5"/>
    <rect x="34" y="20" width="10" height="10" rx="1" fill="#2D3440" stroke="#4D5664" stroke-width="0.5"/>
    <rect x="20" y="32" width="24" height="8" rx="1" fill="#2D3440" stroke="#4D5664" stroke-width="0.5"/>
  </g>
  
  <!-- Chart Line -->
  <g id="chart">
    <path d="M22 36 L26 34 L30 38 L34 32 L38 36 L42 34" stroke="#00D5FF" stroke-width="1.5" fill="none" filter="url(#cyanGlow)"/>
  </g>
  
  <!-- Status Indicators -->
  <g id="indicators">
    <circle cx="36" cy="24" r="2" fill="#44FF44" filter="url(#greenGlow)"/>
    <circle cx="40" cy="24" r="2" fill="#FF4444" filter="url(#redGlow)"/>
  </g>
  
  <!-- Stand -->
  <g id="stand">
    <rect x="28" y="44" width="8" height="4" rx="2" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="1"/>
    <rect x="24" y="48" width="16" height="3" rx="1.5" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="1"/>
  </g>
  
  <!-- Bolts -->
  <g id="bolts">
    <use href="#bolt" x="26" y="50"/>
    <use href="#bolt" x="38" y="50"/>
  </g>
</svg>