<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="metalGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4D5664"/>
      <stop offset="50%" stop-color="#343B46"/>
      <stop offset="100%" stop-color="#1D232C"/>
    </linearGradient>
    <linearGradient id="highlightGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="redGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Shadow -->
  <rect x="20" y="44" width="24" height="6" rx="3" fill="#000000" opacity="0.2" filter="url(#shadow)"/>
  
  <!-- Alarm Body -->
  <g id="body">
    <rect x="24" y="20" width="16" height="24" rx="4" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="2"/>
    <rect x="24" y="20" width="16" height="12" rx="4" fill="url(#highlightGradient)" opacity="0.3"/>
  </g>
  
  <!-- Bell -->
  <g id="bell">
    <path d="M26 28 Q32 28 32 32 Q32 28 38 28 L38 36 Q32 36 26 36 Z" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="2"/>
    <circle cx="32" cy="38" r="2" fill="#2D3440" stroke="#1A1F26" stroke-width="1"/>
  </g>
  
  <!-- Sound Waves -->
  <g id="waves">
    <path d="M22 30 Q20 32 22 34" stroke="#FF4444" stroke-width="1.5" fill="none" opacity="0.6" filter="url(#redGlow)"/>
    <path d="M42 30 Q44 32 42 34" stroke="#FF4444" stroke-width="1.5" fill="none" opacity="0.6" filter="url(#redGlow)"/>
  </g>
  
  <!-- Alert Light -->
  <g id="light">
    <circle cx="32" cy="26" r="3" fill="#FF4444" filter="url(#redGlow)" opacity="0.9"/>
  </g>
  
  <!-- Base -->
  <g id="base">
    <rect x="26" y="44" width="12" height="4" rx="2" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="1"/>
  </g>
  
  <!-- Bolts -->
  <g id="bolts">
    <use href="#bolt" x="26" y="46"/>
    <use href="#bolt" x="38" y="46"/>
  </g>
</svg>