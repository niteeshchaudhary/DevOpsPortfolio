<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="metalGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4D5664"/>
      <stop offset="50%" stop-color="#343B46"/>
      <stop offset="100%" stop-color="#1D232C"/>
    </linearGradient>
    <linearGradient id="lightGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#44FF44"/>
      <stop offset="100%" stop-color="#00AA00"/>
    </linearGradient>
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#44FF44" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#44FF44" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="highlightGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="greenGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Shadow -->
  <rect x="20" y="48" width="24" height="6" rx="3" fill="#000000" opacity="0.2" filter="url(#shadow)"/>
  
  <!-- Tower Base -->
  <g id="base">
    <rect x="24" y="44" width="16" height="4" rx="2" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="2"/>
  </g>
  
  <!-- Tower Pole -->
  <g id="pole">
    <rect x="28" y="24" width="8" height="20" rx="2" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="2"/>
    <rect x="28" y="24" width="8" height="10" rx="2" fill="url(#highlightGradient)" opacity="0.3"/>
  </g>
  
  <!-- Light Housing -->
  <g id="housing">
    <circle cx="32" cy="20" r="6" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="2"/>
  </g>
  
  <!-- Light Lens -->
  <g id="lens">
    <circle cx="32" cy="20" r="4" fill="url(#lightGradient)" filter="url(#greenGlow)" opacity="0.9"/>
  </g>
  
  <!-- Glow Effect -->
  <g id="glow">
    <circle cx="32" cy="20" r="8" fill="url(#glowGradient)" opacity="0.4"/>
  </g>
  
  <!-- Antenna -->
  <g id="antenna">
    <rect x="31" y="12" width="2" height="6" rx="1" fill="#1A1F26"/>
    <circle cx="32" cy="11" r="1.5" fill="#1A1F26"/>
  </g>
  
  <!-- Signal Waves -->
  <g id="signal">
    <circle cx="32" cy="20" r="10" stroke="#44FF44" stroke-width="0.5" fill="none" opacity="0.3"/>
    <circle cx="32" cy="20" r="14" stroke="#44FF44" stroke-width="0.5" fill="none" opacity="0.2"/>
  </g>
  
  <!-- Bolts -->
  <g id="bolts">
    <use href="#bolt" x="26" y="46"/>
    <use href="#bolt" x="38" y="46"/>
  </g>
</svg>