<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="metalGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4D5664"/>
      <stop offset="50%" stop-color="#343B46"/>
      <stop offset="100%" stop-color="#1D232C"/>
    </linearGradient>
    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A2B3C"/>
      <stop offset="100%" stop-color="#0D151D"/>
    </linearGradient>
    <linearGradient id="highlightGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Shadow -->
  <rect x="16" y="48" width="32" height="6" rx="3" fill="#000000" opacity="0.2" filter="url(#shadow)"/>
  
  <!-- Tower Base -->
  <g id="base">
    <rect x="24" y="44" width="16" height="4" rx="2" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="2"/>
  </g>
  
  <!-- Tower Pole -->
  <g id="pole">
    <rect x="28" y="28" width="8" height="16" rx="2" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="2"/>
    <rect x="28" y="28" width="8" height="8" rx="2" fill="url(#highlightGradient)" opacity="0.3"/>
  </g>
  
  <!-- Control Box -->
  <g id="box">
    <rect x="22" y="16" width="20" height="14" rx="2" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="2"/>
    <rect x="22" y="16" width="20" height="7" rx="2" fill="url(#highlightGradient)" opacity="0.3"/>
  </g>
  
  <!-- Screen -->
  <g id="screen">
    <rect x="25" y="19" width="14" height="8" rx="1" fill="url(#screenGradient)" stroke="#2D3440" stroke-width="1"/>
    <!-- Graph -->
    <path d="M26 25 L29 23 L32 26 L35 22 L38 25" stroke="#00D5FF" stroke-width="1" fill="none" filter="url(#cyanGlow)"/>
  </g>
  
  <!-- Antenna -->
  <g id="antenna">
    <rect x="30" y="10" width="4" height="6" rx="2" fill="#1A1F26" stroke="#2D3440" stroke-width="1"/>
    <line x1="32" y1="10" x2="32" y2="6" stroke="#1A1F26" stroke-width="1.5"/>
    <circle cx="32" cy="5" r="1.5" fill="#1A1F26"/>
  </g>
  
  <!-- Signal Waves -->
  <g id="signal">
    <path d="M34 6 Q36 4 34 2" stroke="#00D5FF" stroke-width="1" fill="none" opacity="0.4"/>
    <path d="M30 6 Q28 4 30 2" stroke="#00D5FF" stroke-width="1" fill="none" opacity="0.4"/>
  </g>
  
  <!-- Status LED -->
  <g id="led">
    <circle cx="32" cy="23" r="1" fill="#44FF44" filter="url(#cyanGlow)"/>
  </g>
  
  <!-- Bolts -->
  <g id="bolts">
    <use href="#bolt" x="26" y="46"/>
    <use href="#bolt" x="38" y="46"/>
  </g>
</svg>