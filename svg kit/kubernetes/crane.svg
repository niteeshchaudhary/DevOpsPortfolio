<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="metalGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4D5664"/>
      <stop offset="50%" stop-color="#343B46"/>
      <stop offset="100%" stop-color="#1D232C"/>
    </linearGradient>
    <linearGradient id="highlightGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Shadow -->
  <path d="M20 44 Q32 44 44 44 Q44 44 40 48 Q32 48 24 48 Q20 48 20 44" fill="#000000" opacity="0.2" filter="url(#shadow)"/>
  
  <!-- Crane Base -->
  <g id="base">
    <rect x="24" y="40" width="16" height="4" rx="2" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="2"/>
  </g>
  
  <!-- Tower -->
  <g id="tower">
    <rect x="28" y="20" width="8" height="20" rx="2" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="2"/>
    <rect x="29" y="22" width="6" height="16" rx="1" fill="url(#highlightGradient)" opacity="0.2"/>
    <!-- Lattice Pattern -->
    <path d="M29 24 L34 28 L29 32" stroke="#1A1F26" stroke-width="0.5" fill="none" opacity="0.3"/>
    <path d="M35 24 L30 28 L35 32" stroke="#1A1F26" stroke-width="0.5" fill="none" opacity="0.3"/>
  </g>
  
  <!-- Jib (Horizontal Arm) -->
  <g id="jib">
    <rect x="20" y="16" width="24" height="4" rx="2" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="2"/>
  </g>
  
  <!-- Cable -->
  <g id="cable">
    <line x1="40" y1="20" x2="40" y2="32" stroke="#1A1F26" stroke-width="1"/>
  </g>
  
  <!-- Hook Block -->
  <g id="hook">
    <rect x="38" y="32" width="4" height="3" rx="1" fill="#1A1F26"/>
    <path d="M38 35 Q40 38 42 35" stroke="#1A1F26" stroke-width="1.5" fill="none"/>
  </g>
  
  <!-- Counterweight -->
  <g id="counterweight">
    <rect x="20" y="14" width="6" height="6" rx="1" fill="#2D3440" stroke="#1A1F26" stroke-width="1"/>
  </g>
  
  <!-- Cab -->
  <g id="cab">
    <rect x="26" y="18" width="6" height="5" rx="1" fill="#00A6D6" opacity="0.6" stroke="#1A1F26" stroke-width="1"/>
  </g>
  
  <!-- Status Light -->
  <g id="light">
    <circle cx="32" cy="22" r="1.5" fill="#44FF44" filter="url(#cyanGlow)"/>
  </g>
  
  <!-- Bolts -->
  <g id="bolts">
    <use href="#bolt" x="26" y="42"/>
    <use href="#bolt" x="38" y="42"/>
  </g>
</svg>