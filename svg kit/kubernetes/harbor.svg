<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="metalGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4D5664"/>
      <stop offset="50%" stop-color="#343B46"/>
      <stop offset="100%" stop-color="#1D232C"/>
    </linearGradient>
    <linearGradient id="highlightGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Water Shadow -->
  <ellipse cx="32" cy="48" rx="20" ry="4" fill="#000000" opacity="0.2" filter="url(#shadow)"/>
  
  <!-- Water -->
  <g id="water">
    <path d="M12 48 Q32 44 52 48 L52 52 Q32 48 12 52 Z" fill="#00D5FF" opacity="0.4"/>
  </g>
  
  <!-- Harbor Base -->
  <g id="base">
    <rect x="16" y="36" width="32" height="12" rx="2" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="2"/>
    <rect x="16" y="36" width="32" height="6" rx="2" fill="url(#highlightGradient)" opacity="0.3"/>
  </g>
  
  <!-- Dock Surface -->
  <g id="dock">
    <rect x="18" y="38" width="28" height="4" rx="1" fill="#2D3440" stroke="#4D5664" stroke-width="1"/>
    <rect x="20" y="39" width="4" height="2" rx="1" fill="#1A1F26"/>
    <rect x="28" y="39" width="4" height="2" rx="1" fill="#1A1F26"/>
    <rect x="36" y="39" width="4" height="2" rx="1" fill="#1A1F26"/>
  </g>
  
  <!-- Crane Rail -->
  <g id="rail">
    <rect x="20" y="32" width="24" height="2" rx="1" fill="#1A1F26"/>
  </g>
  
  <!-- Crane Base -->
  <g id="crane-base">
    <rect x="28" y="20" width="8" height="12" rx="2" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="2"/>
  </g>
  
  <!-- Crane Arm -->
  <g id="crane-arm">
    <rect x="30" y="12" width="4" height="10" rx="2" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="2"/>
    <rect x="24" y="14" width="16" height="3" rx="1" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="1"/>
  </g>
  
  <!-- Cable -->
  <g id="cable">
    <line x1="32" y1="17" x2="32" y2="28" stroke="#1A1F26" stroke-width="1"/>
  </g>
  
  <!-- Hook -->
  <g id="hook">
    <path d="M30 28 Q32 32 34 28" stroke="#1A1F26" stroke-width="1.5" fill="none"/>
  </g>
  
  <!-- Status Light -->
  <g id="light">
    <circle cx="32" cy="24" r="1.5" fill="#44FF44" filter="url(#cyanGlow)"/>
  </g>
  
  <!-- Bolts -->
  <g id="bolts">
    <use href="#bolt" x="18" y="40"/>
    <use href="#bolt" x="46" y="40"/>
  </g>
</svg>