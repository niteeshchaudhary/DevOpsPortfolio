<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="metalGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4D5664"/>
      <stop offset="50%" stop-color="#343B46"/>
      <stop offset="100%" stop-color="#1D232C"/>
    </linearGradient>
    <linearGradient id="highlightGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Shadow -->
  <rect x="12" y="48" width="40" height="6" rx="3" fill="#000000" opacity="0.2" filter="url(#shadow)"/>
  
  <!-- Dock Base -->
  <g id="base">
    <rect x="16" y="36" width="32" height="12" rx="2" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="2"/>
    <rect x="16" y="36" width="32" height="6" rx="2" fill="url(#highlightGradient)" opacity="0.3"/>
  </g>
  
  <!-- Dock Surface -->
  <g id="surface">
    <rect x="18" y="38" width="28" height="4" rx="1" fill="#2D3440" stroke="#4D5664" stroke-width="1"/>
    <rect x="20" y="39" width="4" height="2" rx="1" fill="#1A1F26"/>
    <rect x="28" y="39" width="4" height="2" rx="1" fill="#1A1F26"/>
    <rect x="36" y="39" width="4" height="2" rx="1" fill="#1A1F26"/>
  </g>
  
  <!-- Mooring Bits -->
  <g id="mooring">
    <rect x="14" y="34" width="4" height="4" rx="1" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="1"/>
    <rect x="46" y="34" width="4" height="4" rx="1" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="1"/>
  </g>
  
  <!-- Edge Markers -->
  <g id="markers">
    <circle cx="16" cy="40" r="2" fill="#44FF44" filter="url(#cyanGlow)" opacity="0.8"/>
    <circle cx="48" cy="40" r="2" fill="#44FF44" filter="url(#cyanGlow)" opacity="0.8"/>
  </g>
  
  <!-- Bolts -->
  <g id="bolts">
    <use href="#bolt" x="18" y="40"/>
    <use href="#bolt" x="46" y="40"/>
  </g>
</svg>