<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="metalGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4D5664"/>
      <stop offset="50%" stop-color="#343B46"/>
      <stop offset="100%" stop-color="#1D232C"/>
    </linearGradient>
    <linearGradient id="highlightGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Shadow -->
  <rect x="12" y="48" width="40" height="6" rx="3" fill="#000000" opacity="0.2" filter="url(#shadow)"/>
  
  <!-- Bridge Deck -->
  <g id="deck">
    <rect x="16" y="28" width="32" height="8" rx="2" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="2"/>
    <rect x="16" y="28" width="32" height="4" rx="2" fill="url(#highlightGradient)" opacity="0.3"/>
  </g>
  
  <!-- Road Surface -->
  <g id="road">
    <rect x="18" y="30" width="28" height="4" rx="1" fill="#2D3440" stroke="#4D5664" stroke-width="1"/>
    <line x1="18" y1="32" x2="46" y2="32" stroke="#FFAA00" stroke-width="1" stroke-dasharray="4,2" opacity="0.6"/>
  </g>
  
  <!-- Left Support -->
  <g id="support-left">
    <rect x="14" y="36" width="4" height="12" rx="2" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="2"/>
  </g>
  
  <!-- Right Support -->
  <g id="support-right">
    <rect x="46" y="36" width="4" height="12" rx="2" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="2"/>
  </g>
  
  <!-- Railing Left -->
  <g id="railing-left">
    <rect x="14" y="24" width="4" height="4" rx="1" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="1"/>
    <line x1="15" y1="26" x2="17" y2="26" stroke="#1A1F26" stroke-width="0.5" opacity="0.5"/>
  </g>
  
  <!-- Railing Right -->
  <g id="railing-right">
    <rect x="46" y="24" width="4" height="4" rx="1" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="1"/>
    <line x1="47" y1="26" x2="49" y2="26" stroke="#1A1F26" stroke-width="0.5" opacity="0.5"/>
  </g>
  
  <!-- Status Lights -->
  <g id="lights">
    <circle cx="16" cy="26" r="1" fill="#44FF44" filter="url(#cyanGlow)"/>
    <circle cx="48" cy="26" r="1" fill="#44FF44" filter="url(#cyanGlow)"/>
  </g>
  
  <!-- Bolts -->
  <g id="bolts">
    <use href="#bolt" x="14" y="40"/>
    <use href="#bolt" x="50" y="40"/>
  </g>
</svg>