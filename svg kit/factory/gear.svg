<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="metalGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4D5664"/>
      <stop offset="50%" stop-color="#343B46"/>
      <stop offset="100%" stop-color="#1D232C"/>
    </linearGradient>
    <linearGradient id="highlightGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Shadow -->
  <circle cx="32" cy="48" r="12" fill="#000000" opacity="0.2" filter="url(#shadow)"/>
  
  <!-- Gear Body -->
  <g id="gear">
    <circle cx="32" cy="32" r="16" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="2"/>
    <circle cx="32" cy="32" r="12" fill="url(#highlightGradient)" opacity="0.2"/>
  </g>
  
  <!-- Gear Teeth -->
  <g id="teeth">
    <rect x="30" y="14" width="4" height="4" rx="1" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="1"/>
    <rect x="30" y="46" width="4" height="4" rx="1" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="1"/>
    <rect x="14" y="30" width="4" height="4" rx="1" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="1"/>
    <rect x="46" y="30" width="4" height="4" rx="1" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="1"/>
    <rect x="20" y="20" width="4" height="4" rx="1" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="1"/>
    <rect x="40" y="40" width="4" height="4" rx="1" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="1"/>
    <rect x="20" y="40" width="4" height="4" rx="1" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="1"/>
    <rect x="40" y="20" width="4" height="4" rx="1" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="1"/>
  </g>
  
  <!-- Center Hub -->
  <g id="hub">
    <circle cx="32" cy="32" r="6" fill="#2D3440" stroke="#1A1F26" stroke-width="2"/>
    <circle cx="32" cy="32" r="3" fill="#1A1F26"/>
  </g>
  
  <!-- Bolts -->
  <g id="bolts">
    <use href="#bolt" x="28" y="28"/>
    <use href="#bolt" x="36" y="28"/>
    <use href="#bolt" x="28" y="36"/>
    <use href="#bolt" x="36" y="36"/>
  </g>
</svg>