<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="metalGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4D5664"/>
      <stop offset="50%" stop-color="#343B46"/>
      <stop offset="100%" stop-color="#1D232C"/>
    </linearGradient>
    <linearGradient id="highlightGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Shadow -->
  <rect x="12" y="44" width="40" height="8" rx="4" fill="#000000" opacity="0.2" filter="url(#shadow)"/>
  
  <!-- Base Frame -->
  <g id="base">
    <rect x="12" y="40" width="40" height="4" rx="2" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="2"/>
  </g>
  
  <!-- Left Roller -->
  <g id="roller-left">
    <circle cx="20" cy="32" r="6" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="2"/>
    <circle cx="20" cy="32" r="3" fill="#2D3440"/>
  </g>
  
  <!-- Right Roller -->
  <g id="roller-right">
    <circle cx="44" cy="32" r="6" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="2"/>
    <circle cx="44" cy="32" r="3" fill="#2D3440"/>
  </g>
  
  <!-- Belt -->
  <g id="belt">
    <rect x="14" y="28" width="36" height="8" rx="4" fill="#2D3440" stroke="#1A1F26" stroke-width="2"/>
    <rect x="16" y="30" width="32" height="4" rx="2" fill="url(#highlightGradient)" opacity="0.2"/>
  </g>
  
  <!-- Motor Housing -->
  <g id="motor">
    <rect x="48" y="20" width="10" height="16" rx="2" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="2"/>
    <circle cx="53" cy="28" r="3" fill="#1A1F26"/>
  </g>
  
  <!-- Status Light -->
  <g id="light">
    <circle cx="53" cy="24" r="2" fill="#44FF44" filter="url(#cyanGlow)" opacity="0.8"/>
  </g>
  
  <!-- Bolts -->
  <g id="bolts">
    <use href="#bolt" x="16" y="40"/>
    <use href="#bolt" x="48" y="40"/>
  </g>
</svg>