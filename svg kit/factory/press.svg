<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="metalGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4D5664"/>
      <stop offset="50%" stop-color="#343B46"/>
      <stop offset="100%" stop-color="#1D232C"/>
    </linearGradient>
    <linearGradient id="highlightGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="amberGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Shadow -->
  <rect x="16" y="44" width="32" height="8" rx="4" fill="#000000" opacity="0.2" filter="url(#shadow)"/>
  
  <!-- Base -->
  <g id="base">
    <rect x="20" y="40" width="24" height="4" rx="2" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="2"/>
  </g>
  
  <!-- Press Body -->
  <g id="body">
    <rect x="24" y="16" width="16" height="24" rx="4" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="2"/>
    <rect x="24" y="16" width="16" height="12" rx="4" fill="url(#highlightGradient)" opacity="0.3"/>
  </g>
  
  <!-- Press Head -->
  <g id="head">
    <rect x="26" y="36" width="12" height="6" rx="2" fill="#2D3440" stroke="#1A1F26" stroke-width="1"/>
  </g>
  
  <!-- Guide Rails -->
  <g id="rails">
    <rect x="22" y="20" width="2" height="20" rx="1" fill="#1A1F26"/>
    <rect x="40" y="20" width="2" height="20" rx="1" fill="#1A1F26"/>
  </g>
  
  <!-- Warning Light -->
  <g id="light">
    <circle cx="32" cy="22" r="2" fill="#FFAA00" filter="url(#amberGlow)" opacity="0.8"/>
  </g>
  
  <!-- Bolts -->
  <g id="bolts">
    <use href="#bolt" x="22" y="42"/>
    <use href="#bolt" x="42" y="42"/>
  </g>
</svg>