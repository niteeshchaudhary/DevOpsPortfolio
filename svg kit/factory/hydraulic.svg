<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="metalGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4D5664"/>
      <stop offset="50%" stop-color="#343B46"/>
      <stop offset="100%" stop-color="#1D232C"/>
    </linearGradient>
    <linearGradient id="highlightGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="glassGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00A6D6" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#00A6D6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00A6D6" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  
  <!-- Shadow -->
  <rect x="16" y="44" width="32" height="8" rx="4" fill="#000000" opacity="0.2" filter="url(#shadow)"/>
  
  <!-- Base -->
  <g id="base">
    <rect x="20" y="40" width="24" height="4" rx="2" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="2"/>
  </g>
  
  <!-- Cylinder Body -->
  <g id="cylinder">
    <rect x="24" y="20" width="16" height="20" rx="4" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="2"/>
    <rect x="24" y="20" width="16" height="10" rx="4" fill="url(#highlightGradient)" opacity="0.3"/>
  </g>
  
  <!-- Piston Rod -->
  <g id="rod">
    <rect x="30" y="40" width="4" height="8" rx="2" fill="#2D3440" stroke="#1A1F26" stroke-width="1"/>
  </g>
  
  <!-- Fluid Window -->
  <g id="glass">
    <rect x="26" y="24" width="12" height="12" rx="2" fill="url(#glassGradient)" stroke="#00A6D6" stroke-width="1" opacity="0.6"/>
  </g>
  
  <!-- Fluid Level -->
  <g id="fluid">
    <rect x="27" y="28" width="10" height="6" rx="1" fill="#00D5FF" opacity="0.6"/>
  </g>
  
  <!-- Pressure Gauge -->
  <g id="gauge">
    <circle cx="32" cy="28" r="4" fill="#1A1F26" stroke="#4D5664" stroke-width="1"/>
    <path d="M32 26 L32 28 L34 30" stroke="#44FF44" stroke-width="1" fill="none" id="gaugeNeedle"/>
  </g>
  
  <!-- Bolts -->
  <g id="bolts">
    <use href="#bolt" x="22" y="42"/>
    <use href="#bolt" x="42" y="42"/>
  </g>
</svg>