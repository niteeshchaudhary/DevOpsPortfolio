<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="metalGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4D5664"/>
      <stop offset="50%" stop-color="#343B46"/>
      <stop offset="100%" stop-color="#1D232C"/>
    </linearGradient>
    <linearGradient id="highlightGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="greenGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Shadow -->
  <rect x="12" y="48" width="40" height="6" rx="3" fill="#000000" opacity="0.2" filter="url(#shadow)"/>
  
  <!-- Router Body -->
  <g id="body">
    <rect x="16" y="20" width="32" height="24" rx="4" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="2"/>
    <rect x="16" y="20" width="32" height="12" rx="4" fill="url(#highlightGradient)" opacity="0.3"/>
  </g>
  
  <!-- Antennas -->
  <g id="antennas">
    <rect x="20" y="14" width="2" height="8" rx="1" fill="#2D3440" stroke="#1A1F26" stroke-width="1"/>
    <rect x="42" y="14" width="2" height="8" rx="1" fill="#2D3440" stroke="#1A1F26" stroke-width="1"/>
    <circle cx="21" cy="13" r="2" fill="#1A1F26"/>
    <circle cx="43" cy="13" r="2" fill="#1A1F26"/>
  </g>
  
  <!-- Signal Waves -->
  <g id="signal">
    <path d="M21 10 Q24 8 21 6" stroke="#00D5FF" stroke-width="1" fill="none" opacity="0.6"/>
    <path d="M43 10 Q46 8 43 6" stroke="#00D5FF" stroke-width="1" fill="none" opacity="0.6"/>
  </g>
  
  <!-- Port Row -->
  <g id="ports">
    <rect x="20" y="26" width="4" height="5" rx="1" fill="#1A1F26"/>
    <rect x="26" y="26" width="4" height="5" rx="1" fill="#1A1F26"/>
    <rect x="32" y="26" width="4" height="5" rx="1" fill="#1A1F26"/>
    <rect x="38" y="26" width="4" height="5" rx="1" fill="#1A1F26"/>
  </g>
  
  <!-- Status LEDs -->
  <g id="leds">
    <circle cx="21" cy="34" r="1" fill="#44FF44" filter="url(#greenGlow)"/>
    <circle cx="27" cy="34" r="1" fill="#44FF44" filter="url(#greenGlow)"/>
    <circle cx="33" cy="34" r="1" fill="#00D5FF" filter="url(#cyanGlow)"/>
    <circle cx="39" cy="34" r="1" fill="#44FF44" filter="url(#greenGlow)"/>
  </g>
  
  <!-- Power Button -->
  <g id="power">
    <circle cx="43" cy="38" r="3" fill="#1A1F26" stroke="#4D5664" stroke-width="1"/>
    <path d="M43 36 L43 38 L45 39" stroke="#44FF44" stroke-width="0.5" fill="none"/>
  </g>
  
  <!-- Bolts -->
  <g id="bolts">
    <use href="#bolt" x="18" y="22"/>
    <use href="#bolt" x="46" y="22"/>
    <use href="#bolt" x="18" y="42"/>
    <use href="#bolt" x="46" y="42"/>
  </g>
</svg>