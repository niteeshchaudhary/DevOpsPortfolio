<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="metalGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4D5664"/>
      <stop offset="50%" stop-color="#343B46"/>
      <stop offset="100%" stop-color="#1D232C"/>
    </linearGradient>
    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A2B3C"/>
      <stop offset="100%" stop-color="#0D151D"/>
    </linearGradient>
    <linearGradient id="highlightGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="greenGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Shadow -->
  <rect x="16" y="48" width="32" height="6" rx="3" fill="#000000" opacity="0.2" filter="url(#shadow)"/>
  
  <!-- Terminal Body -->
  <g id="body">
    <rect x="16" y="20" width="32" height="24" rx="4" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="2"/>
    <rect x="16" y="20" width="32" height="12" rx="4" fill="url(#highlightGradient)" opacity="0.3"/>
  </g>
  
  <!-- Screen -->
  <g id="screen">
    <rect x="20" y="24" width="24" height="14" rx="1" fill="url(#screenGradient)" stroke="#2D3440" stroke-width="1"/>
    <!-- Code Lines -->
    <rect x="22" y="27" width="20" height="1.5" rx="0.5" fill="#00D5FF" opacity="0.6"/>
    <rect x="22" y="30" width="16" height="1.5" rx="0.5" fill="#00D5FF" opacity="0.5"/>
    <rect x="22" y="33" width="18" height="1.5" rx="0.5" fill="#00D5FF" opacity="0.4"/>
  </g>
  
  <!-- Keyboard -->
  <g id="keyboard">
    <rect x="20" y="40" width="24" height="4" rx="1" fill="#1A1F26" stroke="#2D3440" stroke-width="1"/>
    <rect x="22" y="41" width="2" height="2" rx="0.5" fill="#44FF44" opacity="0.6"/>
    <rect x="26" y="41" width="2" height="2" rx="0.5" fill="#44FF44" opacity="0.6"/>
    <rect x="30" y="41" width="2" height="2" rx="0.5" fill="#44FF44" opacity="0.6"/>
    <rect x="34" y="41" width="2" height="2" rx="0.5" fill="#44FF44" opacity="0.6"/>
    <rect x="38" y="41" width="2" height="2" rx="0.5" fill="#44FF44" opacity="0.6"/>
  </g>
  
  <!-- Status LED -->
  <g id="led">
    <circle cx="32" cy="31" r="1" fill="#44FF44" filter="url(#cyanGlow)"/>
  </g>
  
  <!-- Bolts -->
  <g id="bolts">
    <use href="#bolt" x="18" y="22"/>
    <use href="#bolt" x="46" y="22"/>
    <use href="#bolt" x="18" y="42"/>
    <use href="#bolt" x="46" y="42"/>
  </g>
</svg>