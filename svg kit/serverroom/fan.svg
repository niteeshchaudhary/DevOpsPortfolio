<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="metalGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4D5664"/>
      <stop offset="50%" stop-color="#343B46"/>
      <stop offset="100%" stop-color="#1D232C"/>
    </linearGradient>
    <linearGradient id="highlightGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Shadow -->
  <circle cx="32" cy="48" r="12" fill="#000000" opacity="0.2" filter="url(#shadow)"/>
  
  <!-- Fan Housing -->
  <g id="housing">
    <circle cx="32" cy="32" r="16" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="2"/>
    <circle cx="32" cy="32" r="12" fill="url(#highlightGradient)" opacity="0.2"/>
  </g>
  
  <!-- Fan Blades -->
  <g id="blades">
    <ellipse cx="32" cy="24" rx="3" ry="8" fill="#2D3440" stroke="#1A1F26" stroke-width="1"/>
    <ellipse cx="32" cy="40" rx="3" ry="8" fill="#2D3440" stroke="#1A1F26" stroke-width="1"/>
    <ellipse cx="24" cy="32" rx="3" ry="8" fill="#2D3440" stroke="#1A1F26" stroke-width="1" transform="rotate(90 24 32)"/>
    <ellipse cx="40" cy="32" rx="3" ry="8" fill="#2D3440" stroke="#1A1F26" stroke-width="1" transform="rotate(90 40 32)"/>
  </g>
  
  <!-- Center Hub -->
  <g id="hub">
    <circle cx="32" cy="32" r="4" fill="#1A1F26" stroke="#2D3440" stroke-width="1"/>
    <circle cx="32" cy="32" r="2" fill="#2D3440"/>
  </g>
  
  <!-- Airflow Indicator -->
  <g id="airflow">
    <path d="M20 32 Q16 32 16 28" stroke="#00D5FF" stroke-width="1.5" fill="none" opacity="0.6" filter="url(#cyanGlow)"/>
    <path d="M44 32 Q48 32 48 28" stroke="#00D5FF" stroke-width="1.5" fill="none" opacity="0.6" filter="url(#cyanGlow)"/>
  </g>
  
  <!-- Bolts -->
  <g id="bolts">
    <use href="#bolt" x="28" y="20"/>
    <use href="#bolt" x="36" y="20"/>
    <use href="#bolt" x="28" y="44"/>
    <use href="#bolt" x="36" y="44"/>
  </g>
</svg>