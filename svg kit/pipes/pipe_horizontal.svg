<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="metalGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4D5664"/>
      <stop offset="50%" stop-color="#343B46"/>
      <stop offset="100%" stop-color="#1D232C"/>
    </linearGradient>
    <linearGradient id="glassGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00A6D6" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#00A6D6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00A6D6" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Shadow -->
  <path d="M8 32 L56 32 Q56 32 52 36 L12 36 Q8 36 8 32" fill="#000000" opacity="0.2" filter="url(#shadow)"/>
  
  <!-- Metal Pipe Body -->
  <g id="metal">
    <path d="M8 28 L56 28 L56 36 Q56 36 52 36 L12 36 Q8 36 8 36 Z" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M8 28 L56 28 L56 32 Q56 32 52 32 L12 32 Q8 32 8 32 Z" fill="url(#highlightGradient)" opacity="0.3"/>
  </g>
  
  <!-- Glass Window -->
  <g id="glass">
    <rect x="20" y="29" width="24" height="6" rx="3" fill="url(#glassGradient)" stroke="#00A6D6" stroke-width="1" opacity="0.6"/>
  </g>
  
  <!-- Water Flow -->
  <g id="water">
    <rect x="22" y="30" width="20" height="4" rx="2" fill="#00D5FF" opacity="0.8"/>
  </g>
  
  <!-- Bolts -->
  <g id="bolts">
    <use href="#bolt" x="14" y="30"/>
    <use href="#bolt" x="14" y="34"/>
    <use href="#bolt" x="50" y="30"/>
    <use href="#bolt" x="50" y="34"/>
  </g>
</svg>