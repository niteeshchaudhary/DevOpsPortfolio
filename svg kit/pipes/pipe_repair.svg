<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="metalGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4D5664"/>
      <stop offset="50%" stop-color="#343B46"/>
      <stop offset="100%" stop-color="#1D232C"/>
    </linearGradient>
    <linearGradient id="glassGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00A6D6" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#00A6D6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00A6D6" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="greenGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Shadow -->
  <rect x="8" y="28" width="48" height="8" rx="4" fill="#000000" opacity="0.2" filter="url(#shadow)"/>
  
  <!-- Metal Pipe Body -->
  <g id="metal">
    <rect x="8" y="24" width="48" height="16" rx="8" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="2" stroke-linejoin="round"/>
    <rect x="8" y="24" width="48" height="8" rx="8" fill="url(#highlightGradient)" opacity="0.3"/>
  </g>
  
  <!-- Repair Clamp -->
  <g id="repair">
    <rect x="24" y="20" width="16" height="24" rx="4" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="2"/>
    <rect x="26" y="22" width="12" height="20" rx="2" fill="#2D3440" stroke="#4D5664" stroke-width="1"/>
    <circle cx="28" cy="26" r="2" fill="#44FF44" filter="url(#greenGlow)"/>
    <circle cx="36" cy="26" r="2" fill="#44FF44" filter="url(#greenGlow)"/>
  </g>
  
  <!-- Glass Window -->
  <g id="glass">
    <rect x="14" y="26" width="8" height="12" rx="4" fill="url(#glassGradient)" stroke="#00A6D6" stroke-width="1" opacity="0.6"/>
    <rect x="42" y="26" width="8" height="12" rx="4" fill="url(#glassGradient)" stroke="#00A6D6" stroke-width="1" opacity="0.6"/>
  </g>
  
  <!-- Water Flow -->
  <g id="water">
    <rect x="16" y="28" width="6" height="8" rx="3" fill="#00D5FF" opacity="0.8"/>
    <rect x="44" y="28" width="6" height="8" rx="3" fill="#00D5FF" opacity="0.8"/>
  </g>
  
  <!-- Bolts -->
  <g id="bolts">
    <use href="#bolt" x="14" y="28"/>
    <use href="#bolt" x="14" y="36"/>
    <use href="#bolt" x="50" y="28"/>
    <use href="#bolt" x="50" y="36"/>
  </g>
</svg>