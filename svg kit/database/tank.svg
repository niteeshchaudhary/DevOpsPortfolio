<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="metalGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4D5664"/>
      <stop offset="50%" stop-color="#343B46"/>
      <stop offset="100%" stop-color="#1D232C"/>
    </linearGradient>
    <linearGradient id="dbGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="glassGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00A6D6" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#00A6D6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00A6D6" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="highlightGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Shadow -->
  <ellipse cx="32" cy="52" rx="16" ry="4" fill="#000000" opacity="0.2" filter="url(#shadow)"/>
  
  <!-- Tank Body -->
  <g id="tank">
    <ellipse cx="32" cy="48" rx="16" ry="6" fill="url(#dbGradient)" stroke="#1A1F26" stroke-width="2"/>
    <rect x="16" y="20" width="32" height="28" rx="0" fill="url(#dbGradient)" stroke="#1A1F26" stroke-width="2"/>
    <ellipse cx="32" cy="20" rx="16" ry="6" fill="url(#dbGradient)" stroke="#1A1F26" stroke-width="2"/>
    <rect x="16" y="20" width="32" height="14" rx="0" fill="url(#highlightGradient)" opacity="0.3"/>
  </g>
  
  <!-- Horizontal Ribs -->
  <g id="ribs">
    <ellipse cx="32" cy="28" rx="16" ry="2" fill="none" stroke="#1A1F26" stroke-width="0.5" opacity="0.3"/>
    <ellipse cx="32" cy="36" rx="16" ry="2" fill="none" stroke="#1A1F26" stroke-width="0.5" opacity="0.3"/>
    <ellipse cx="32" cy="44" rx="16" ry="2" fill="none" stroke="#1A1F26" stroke-width="0.5" opacity="0.3"/>
  </g>
  
  <!-- Sight Glass -->
  <g id="glass">
    <rect x="26" y="24" width="4" height="20" rx="2" fill="url(#glassGradient)" stroke="#00A6D6" stroke-width="1" opacity="0.6"/>
    <rect x="27" y="30" width="2" height="10" rx="1" fill="#00D5FF" opacity="0.8"/>
  </g>
  
  <!-- Top Fitting -->
  <g id="fitting">
    <rect x="28" y="14" width="8" height="6" rx="2" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="1"/>
  </g>
  
  <!-- Bolts -->
  <g id="bolts">
    <use href="#bolt" x="20" y="22"/>
    <use href="#bolt" x="44" y="22"/>
    <use href="#bolt" x="20" y="46"/>
    <use href="#bolt" x="44" y="46"/>
  </g>
</svg>