<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="metalGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4D5664"/>
      <stop offset="50%" stop-color="#343B46"/>
      <stop offset="100%" stop-color="#1D232C"/>
    </linearGradient>
    <linearGradient id="highlightGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Shadow -->
  <rect x="8" y="28" width="48" height="8" rx="4" fill="#000000" opacity="0.2" filter="url(#shadow)"/>
  
  <!-- Pipe Body -->
  <g id="metal">
    <rect x="8" y="24" width="48" height="16" rx="8" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="2" stroke-linejoin="round"/>
    <rect x="8" y="24" width="48" height="8" rx="8" fill="url(#highlightGradient)" opacity="0.3"/>
  </g>
  
  <!-- Valve Handle -->
  <g id="handle">
    <rect x="28" y="12" width="8" height="16" rx="2" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="2"/>
    <rect x="26" y="10" width="12" height="4" rx="2" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="2"/>
    <rect x="26" y="26" width="12" height="4" rx="2" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="2"/>
  </g>
  
  <!-- Valve Body -->
  <g id="valve">
    <rect x="28" y="24" width="8" height="16" rx="2" fill="#2D3440" stroke="#1A1F26" stroke-width="1"/>
  </g>
  
  <!-- Flow Indicator -->
  <g id="indicator">
    <circle cx="32" cy="32" r="3" fill="#1A1F26" stroke="#4D5664" stroke-width="1"/>
    <path d="M32 30 L32 32 L34 33" stroke="#00D5FF" stroke-width="1" fill="none" filter="url(#cyanGlow)"/>
  </g>
  
  <!-- Bolts -->
  <g id="bolts">
    <use href="#bolt" x="14" y="28"/>
    <use href="#bolt" x="14" y="36"/>
    <use href="#bolt" x="50" y="28"/>
    <use href="#bolt" x="50" y="36"/>
  </g>
</svg>