<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="metalGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4D5664"/>
      <stop offset="50%" stop-color="#343B46"/>
      <stop offset="100%" stop-color="#1D232C"/>
    </linearGradient>
    <linearGradient id="highlightGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Shadow -->
  <rect x="16" y="44" width="32" height="8" rx="4" fill="#000000" opacity="0.2" filter="url(#shadow)"/>
  
  <!-- Pump Base -->
  <g id="base">
    <rect x="20" y="40" width="24" height="4" rx="2" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="2"/>
  </g>
  
  <!-- Pump Body -->
  <g id="body">
    <circle cx="32" cy="32" r="12" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="2"/>
    <circle cx="32" cy="32" r="9" fill="url(#highlightGradient)" opacity="0.2"/>
  </g>
  
  <!-- Inlet Port -->
  <g id="inlet">
    <rect x="16" y="28" width="6" height="8" rx="2" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="1"/>
  </g>
  
  <!-- Outlet Port -->
  <g id="outlet">
    <rect x="42" y="28" width="6" height="8" rx="2" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="1"/>
  </g>
  
  <!-- Impeller Housing -->
  <g id="impeller">
    <circle cx="32" cy="32" r="6" fill="#2D3440" stroke="#1A1F26" stroke-width="1"/>
    <path d="M32 28 L34 32 L32 36 L30 32 Z" fill="#4D5664"/>
  </g>
  
  <!-- Motor Housing -->
  <g id="motor">
    <rect x="28" y="16" width="8" height="8" rx="2" fill="url(#metalGradient)" stroke="#1A1F26" stroke-width="1"/>
  </g>
  
  <!-- Status Light -->
  <g id="light">
    <circle cx="32" cy="20" r="1.5" fill="#44FF44" filter="url(#cyanGlow)"/>
  </g>
  
  <!-- Bolts -->
  <g id="bolts">
    <use href="#bolt" x="22" y="42"/>
    <use href="#bolt" x="42" y="42"/>
  </g>
</svg>